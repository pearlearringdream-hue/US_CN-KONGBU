<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14103a">
<title>매일 외국어 챌린지</title>
<style>
:root{--bg:#14103a;--bg2:#2b1d6e;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--tx:#f6f4ff;--mut:#a9a5d6;--hot:#ff8a3d;--gold:#ffd23f;--w:#4cc9f0;--i:#b794ff;--s:#ff6b9d;--ok:#3ddc97;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--tx);background:var(--bg) radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 70%) no-repeat fixed;min-height:100vh;padding:env(safe-area-inset-top) 0 0}
.app{max-width:520px;margin:0 auto;padding:16px 14px calc(88px + env(safe-area-inset-bottom))}
header{padding:8px 4px 14px}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--gold)}
#quote{margin:6px 0 0;color:var(--mut);font-size:14px;line-height:1.5}
.badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.badge{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.badge.fire{background:linear-gradient(90deg,#ff5e3a,var(--hot));border:0;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.datebar b{font-size:17px}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:20px;font-weight:800}
.ib:disabled{opacity:.3}
.today{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:url(#g);transition:stroke-dashoffset .5s}
.ring.done .fg{stroke:var(--ok)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring strong{font-size:30px;line-height:1}
.ring small{color:var(--mut);font-size:12px;margin-top:2px}
.today p{margin:0 0 10px;font-size:15px;line-height:1.5;font-weight:700}
.goal{font-size:13px;color:var(--mut);background:none;border:1px dashed var(--line);border-radius:10px;padding:7px 11px;color:var(--tx)}
.lang h3{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.lang h3 span{font-size:13px;color:var(--gold);font-weight:800}
.lang.en{border-top:3px solid var(--hot)}
.lang.zh{border-top:3px solid var(--gold)}
.row{display:grid;grid-template-columns:62px 46px 1fr 46px 46px;gap:6px;align-items:center;margin-top:8px}
.row b{font-size:14px;color:var(--c)}
.row button{height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--tx);font-size:16px;font-weight:800}
.row button:active,.ib:active,.seg button:active{transform:scale(.94)}
.row button[data-a$=",1"]{background:var(--c);color:#14103a;border:0}
.row input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--tx);font-size:22px;font-weight:900;text-align:center;min-width:0}
.row input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;height:38px;border:0;border-radius:10px;background:none;color:var(--mut);font-size:14px;font-weight:800}
.seg button.on{background:linear-gradient(90deg,#ff5e3a,var(--hot));color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.nav b{font-size:16px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:rgba(0,0,0,.22);border-radius:14px;padding:10px 6px;text-align:center}
.sum strong{display:block;font-size:20px}
.sum small{font-size:11px;color:var(--mut)}
.trend{font-size:14px;font-weight:700;margin:0 0 10px;text-align:center}
.up{color:var(--ok)}.down{color:var(--hot)}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.wk{display:grid;grid-template-columns:70px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin-top:8px;color:var(--mut)}
.wk div{height:12px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.wk i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--gold));border-radius:6px}
.wk b{color:var(--tx);text-align:right}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(20,16,58,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);max-width:520px;margin:0 auto}
.tabs button{flex:1;height:52px;border-radius:16px;border:0;background:var(--card);color:var(--mut);font-size:15px;font-weight:800}
.tabs button.on{background:linear-gradient(90deg,#ff5e3a,var(--hot));color:#fff}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🔥 오늘도 <em>한 걸음 더!</em></h1>
<p id="quote"></p>
<div class="badges"><span class="badge fire" id="streak"></span><span class="badge" id="allsum"></span></div>
</header>

<section id="v-rec">
<div class="datebar"><button class="ib" id="prev" aria-label="이전 날짜">‹</button><b id="dt"></b><button class="ib" id="next" aria-label="다음 날짜">›</button></div>
<div class="card today">
<div class="ring" id="ring"><svg viewBox="0 0 124 124"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5e3a"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs><circle class="bg" cx="62" cy="62" r="52"/><circle class="fg" id="fg" cx="62" cy="62" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><div><strong id="tot">0</strong><small id="goaltxt"></small></div></div>
<div><p id="msg"></p><button class="goal" id="goalbtn">🎯 하루 목표 바꾸기</button></div>
</div>
<div id="langs"></div>
</section>

<section id="v-stat" class="hide">
<div class="card">
<div class="seg" id="sMode"><button data-m="week">주간</button><button data-m="month">월별</button></div>
<div class="seg" id="sLang"><button data-l="all">전체</button><button data-l="en">영어</button><button data-l="zh">중국어</button></div>
<div class="nav"><button class="ib" id="sPrev" aria-label="이전 기간">‹</button><b id="sTitle"></b><button class="ib" id="sNext" aria-label="다음 기간">›</button></div>
<div class="sum" id="sSum"></div>
<p class="trend" id="sTrend"></p>
<div id="sChart"></div>
<div class="legend"><span><i style="background:var(--w)"></i>단어</span><span><i style="background:var(--i)"></i>숙어</span><span><i style="background:var(--s)"></i>문장</span></div>
</div>
<div class="card" id="wkCard"><b>주차별 합계</b><div id="wkList"></div></div>
</section>
</div>

<nav class="tabs"><button class="on" data-t="rec">✏️ 오늘 기록</button><button data-t="stat">📈 통계</button></nav>

<script>
const KEY='studylog_v1';
let db=null;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.records)db={records:{},goal:30};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const $=s=>document.querySelector(s);
const LANGS=[['en','영어','🇺🇸','숙어'],['zh','중국어','🇨🇳','성어·숙어']];
const ITEMS=[['w','단어','--w'],['i','숙어','--i'],['s','문장','--s']];
const QUOTES=['꾸준함은 재능을 이긴다. 오늘도 한 줄이면 충분해요.','어제의 나보다 단어 하나만 더!','작은 반복이 유창함을 만듭니다.','하루 10분, 1년이면 3,650분의 실력.','완벽하지 않아도 괜찮아요. 매일 하는 게 이깁니다.','지금 외운 한 문장이 내일의 자신감이 됩니다.','포기하지 않는 사람이 결국 말하게 됩니다.'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const DOW='일월화수목금토';
const fmtLong=s=>{const d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')'};
const get=(s,l,k)=>(db.records[s]&&db.records[s][l]&&db.records[s][l][k])||0;
function set(s,l,k,v){v=Math.max(0,Math.min(9999,parseInt(v,10)||0));const r=db.records;r[s]=r[s]||{};r[s][l]=r[s][l]||{};r[s][l][k]=v;save()}
const sumDay=(s,l)=>ITEMS.reduce((a,[k])=>a+get(s,l,k),0);
const dayTotal=s=>sumDay(s,'en')+sumDay(s,'zh');
const todayStr=()=>ymd(new Date());
let cur=todayStr();

function streak(){let d=new Date();if(!dayTotal(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(dayTotal(ymd(d))>0){n++;d.setDate(d.getDate()-1)}return n}
function msg(t,g){const p=t/g;return t===0?'첫 기록을 남겨볼까요? 1개면 충분해요 💪':p<.5?'좋은 시작이에요! 조금만 더 달려요 🏃':p<1?'목표가 눈앞이에요! 거의 다 왔어요 🔥':'🎉 목표 달성! 오늘도 해냈어요'}

function renderRec(){
  const t=todayStr();
  $('#dt').textContent=fmtLong(cur)+(cur===t?' · 오늘':'');
  $('#next').disabled=cur>=t;
  let h='';
  LANGS.forEach(([l,n,f,idm])=>{
    h+='<div class="card lang '+l+'"><h3>'+f+' '+n+'<span>오늘 '+sumDay(cur,l)+'개</span></h3>';
    ITEMS.forEach(([k,kn,c])=>{
      h+='<div class="row" style="--c:var('+c+')"><b>'+(k==='i'?idm:kn)+'</b><button data-a="'+l+','+k+',-1" aria-label="'+kn+' 1 줄이기">−</button><input type="number" inputmode="numeric" min="0" value="'+get(cur,l,k)+'" data-i="'+l+','+k+'" aria-label="'+n+' '+kn+' 개수"><button data-a="'+l+','+k+',1">+1</button><button data-a="'+l+','+k+',5">+5</button></div>';
    });
    h+='</div>';
  });
  $('#langs').innerHTML=h;
  const tot=dayTotal(cur),g=db.goal||30,p=Math.min(1,tot/g);
  $('#tot').textContent=tot;
  $('#goaltxt').textContent='목표 '+g+'개';
  $('#fg').style.strokeDashoffset=326.7*(1-p);
  $('#ring').classList.toggle('done',tot>=g);
  $('#msg').textContent=msg(tot,g);
  $('#streak').textContent='🔥 '+streak()+'일 연속';
  let all=0;Object.keys(db.records).forEach(s=>all+=dayTotal(s));
  $('#allsum').textContent='누적 '+all.toLocaleString()+'개';
}
$('#langs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const [l,k,d]=b.dataset.a.split(',');
  set(cur,l,k,get(cur,l,k)+(+d));renderRec();
});
$('#langs').addEventListener('change',e=>{
  const i=e.target.dataset.i;if(!i)return;
  const [l,k]=i.split(',');set(cur,l,k,e.target.value);renderRec();
});
$('#prev').onclick=()=>{const d=parse(cur);d.setDate(d.getDate()-1);cur=ymd(d);renderRec()};
$('#next').onclick=()=>{const d=parse(cur);d.setDate(d.getDate()+1);if(ymd(d)<=todayStr()){cur=ymd(d);renderRec()}};
$('#goalbtn').onclick=()=>{const v=prompt('하루 목표 개수 (단어+숙어+문장 합계)',db.goal||30);if(v!==null){const n=parseInt(v,10);if(n>0){db.goal=Math.min(n,9999);save();renderRec()}}};

/* 통계 */
let st={mode:'week',lang:'all',off:0};
function period(off){
  const now=new Date(),days=[];let title;
  if(st.mode==='week'){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);
    for(let i=0;i<7;i++)days.push(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i));
    const a=days[0],b=days[6];
    title=(a.getMonth()+1)+'/'+a.getDate()+' ~ '+(b.getMonth()+1)+'/'+b.getDate();
  }else{
    const f=new Date(now.getFullYear(),now.getMonth()+off,1);
    const n=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
    for(let i=0;i<n;i++)days.push(new Date(f.getFullYear(),f.getMonth(),i+1));
    title=f.getFullYear()+'년 '+(f.getMonth()+1)+'월';
  }
  return {days,title};
}
function vals(d){
  const s=ymd(d),ls=st.lang==='all'?['en','zh']:[st.lang],o={w:0,i:0,s:0};
  ls.forEach(l=>ITEMS.forEach(([k])=>o[k]+=get(s,l,k)));
  return o;
}
const tt=o=>o.w+o.i+o.s;
function chart(days,data){
  const W=360,H=220,L=30,B=30,T=18,n=days.length,pw=W-L-6,ph=H-B-T;
  const mx=Math.max(4,...data.map(tt)),top=Math.ceil(mx/4)*4;
  const col={w:'var(--w)',i:'var(--i)',s:'var(--s)'};
  let g='';
  for(let i=0;i<=4;i++){
    const y=T+ph-ph*i/4;
    g+='<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(255,255,255,.1)"/><text x="'+(L-5)+'" y="'+(y+4)+'" fill="#a9a5d6" font-size="10" text-anchor="end">'+(top*i/4)+'</text>';
  }
  const bw=pw/n,today=todayStr();
  days.forEach((d,idx)=>{
    const v=data[idx],x=L+idx*bw+bw*.15,w=bw*.7;let y=T+ph;
    ['w','i','s'].forEach(k=>{
      const h=ph*v[k]/top;
      if(h>0){y-=h;g+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+col[k]+'" rx="'+Math.min(3,w/3)+'"/>'}
    });
    const isT=ymd(d)===today;
    if(n<=7&&tt(v)>0)g+='<text x="'+(x+w/2)+'" y="'+(y-4)+'" fill="#f6f4ff" font-size="11" font-weight="700" text-anchor="middle">'+tt(v)+'</text>';
    if(n<=7)g+='<text x="'+(x+w/2)+'" y="'+(H-14)+'" fill="'+(isT?'#ffd23f':'#a9a5d6')+'" font-size="11" font-weight="700" text-anchor="middle">'+DOW[d.getDay()]+'</text><text x="'+(x+w/2)+'" y="'+(H-3)+'" fill="#a9a5d6" font-size="9" text-anchor="middle">'+d.getDate()+'</text>';
    else if(idx===0||(idx+1)%5===0||isT)g+='<text x="'+(x+w/2)+'" y="'+(H-10)+'" fill="'+(isT?'#ffd23f':'#a9a5d6')+'" font-size="10" text-anchor="middle">'+d.getDate()+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="학습량 그래프">'+g+'</svg>';
}
function renderStat(){
  const {days,title}=period(st.off),data=days.map(vals);
  const prev=period(st.off-1).days.map(vals);
  $('#sTitle').textContent=title;
  $('#sNext').disabled=st.off>=0;
  document.querySelectorAll('#sMode button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.mode));
  document.querySelectorAll('#sLang button').forEach(b=>b.classList.toggle('on',b.dataset.l===st.lang));
  const T={w:0,i:0,s:0};let active=0;
  data.forEach(v=>{T.w+=v.w;T.i+=v.i;T.s+=v.s;if(tt(v)>0)active++});
  const total=tt(T),pt=prev.reduce((a,v)=>a+tt(v),0),unit=st.mode==='week'?'주':'달';
  $('#sSum').innerHTML=[['총합',total],['학습일',active+'일'],['일평균',active?Math.round(total/active):0],['단어',T.w],['숙어',T.i],['문장',T.s]].map(a=>'<div><strong>'+a[1]+'</strong><small>'+a[0]+'</small></div>').join('');
  let tr;
  if(!total)tr='아직 기록이 없어요. 오늘부터 시작해요! 🌱';
  else if(!pt)tr='지난 '+unit+' 기록이 없어 비교할 수 없어요. 꾸준히 쌓아가요 💪';
  else{const r=Math.round((total-pt)/pt*100);tr=r>=0?'<span class="up">지난 '+unit+'보다 '+r+'% ▲ 훌륭해요!</span>':'<span class="down">지난 '+unit+'보다 '+Math.abs(r)+'% ▼ 다시 속도를 올려봐요</span>'}
  $('#sTrend').innerHTML=tr;
  $('#sChart').innerHTML=chart(days,data);
  const wk=st.mode==='month';
  $('#wkCard').classList.toggle('hide',!wk);
  if(wk){
    const groups=[];
    days.forEach((d,i)=>{
      const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));const key=ymd(m);
      let g=groups.find(x=>x.k===key);
      if(!g){g={k:key,label:(d.getMonth()+1)+'/'+d.getDate()+'~',sum:0};groups.push(g)}
      g.sum+=tt(data[i]);
    });
    const mx=Math.max(1,...groups.map(g=>g.sum));
    $('#wkList').innerHTML=groups.map(g=>'<div class="wk"><span>'+g.label+'</span><div><i style="width:'+Math.round(g.sum/mx*100)+'%"></i></div><b>'+g.sum+'</b></div>').join('');
  }
}
$('#sMode').onclick=e=>{const b=e.target.closest('button');if(b){st.mode=b.dataset.m;st.off=0;renderStat()}};
$('#sLang').onclick=e=>{const b=e.target.closest('button');if(b){st.lang=b.dataset.l;renderStat()}};
$('#sPrev').onclick=()=>{st.off--;renderStat()};
$('#sNext').onclick=()=>{if(st.off<0){st.off++;renderStat()}};

document.querySelector('.tabs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#v-rec').classList.toggle('hide',b.dataset.t!=='rec');
  $('#v-stat').classList.toggle('hide',b.dataset.t!=='stat');
  if(b.dataset.t==='stat')renderStat();else renderRec();
  scrollTo(0,0);
};
$('#quote').textContent=QUOTES[new Date().getDate()%QUOTES.length];
renderRec();
</script>
</body>
</html>
